name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    uses: Anastylosis/.github/.github/workflows/go-release.yml@v1
    permissions:
      contents: write
      discussions: write
      id-token: write
      attestations: write
    secrets: inherit
    with:
      binary-name: msd
      main-package: ./cmd/msd
      nfpm: true
      aur: true
      aur-pkgname: msd
      aur-commit-username: Wasylq
      aur-commit-email: wasylq@protonmail.com
      environment-name: manual-smoke-gate
      environment-url: https://github.com/Anastylosis/MSD/blob/master/CONTRIBUTING.md#approver-checklist
      # The category must already exist; renaming it on GitHub without changing
      # it here fails the API call after the gate has been approved.
      discussion-category: Announcements
      pre-release-checklist: |
        - [ ] `go test -tags=integration ./site/...` passed locally — **EVERY**
              site handler, not just the one you changed. CI cannot run these:
              they fetch live sites.
        - [ ] Any handler whose site changed markup this cycle re-checked by hand.
        - [ ] Release notes describe the user-visible changes.

        Long form: CONTRIBUTING.md → "Cutting a release".
      pre-release-notice: >-
        I ran the FULL live-site integration suite locally before approving
        (`go test -tags=integration ./site/...`, every handler) and every test
        passed. I reviewed the release notes.
      docker-image: ghcr.io/anastylosis/msd
      install-instructions: |
        Download the binary for your platform, extract, and place it on your PATH:

        ```sh
        # Linux (amd64)
        tar xzf msd-${{ github.ref_name }}-linux-amd64.tar.gz
        chmod +x msd
        ./msd --version

        # macOS (Apple Silicon)
        tar xzf msd-${{ github.ref_name }}-darwin-arm64.tar.gz
        chmod +x msd
        ./msd --version
        ```

        ### Linux packages

        ```sh
        # Arch Linux (AUR)
        yay -S msd

        # Debian / Ubuntu
        sudo dpkg -i msd_*_amd64.deb

        # Fedora / RHEL
        sudo rpm -i msd_*_amd64.rpm
        ```

        Or build from source:
        ```sh
        go install github.com/Anastylosis/MSD/cmd/msd@${{ github.ref_name }}
        ```

        Or pull the Docker image:
        ```sh
        docker pull ghcr.io/anastylosis/msd:{{version}}
        ```

  # Gated behind the release job, so no image lands on GHCR unless the manual
  # smoke-test approval went through.
  docker:
    needs: release
    uses: Anastylosis/.github/.github/workflows/docker-publish.yml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      mode: release
