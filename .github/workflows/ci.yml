name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: Anastylosis/.github/.github/workflows/go-ci.yml@v1
    permissions:
      contents: read
      checks: write
      # Codecov uploads authenticate with an OIDC token. A reusable workflow
      # cannot grant itself more than the caller holds, so it has to be here.
      id-token: write
    secrets: inherit
    with:
      binary-name: msd
      main-package: ./cmd/msd
      vet-integration-tag: true
      check-aur-srcinfo: true
      check-dockerfile-go-version: true
      # Every package here is a scraper, so the failure that matters most is a
      # unit test quietly fetching the live site and grading real markup
      # instead of its own fixture — it passes while the parser is broken.
      # Verified passing with no network before enabling.
      offline-isolation: true
      # internal/fsutil/sanitize.go reasons about Windows reserved names and
      # the 255-byte cap, and the resume path relies on rename semantics that
      # differ there — all of it currently only ever executed on Linux.
      platform-tests: true
